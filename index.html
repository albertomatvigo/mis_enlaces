function parseData(txt){
  try{const n=JSON.parse(txt);if(!n||!Array.isArray(n.cats)||!n.cats.length)return null;
    const ids=new Set(n.cats.map(c=>c&&c.id).filter(Boolean));
    const cats=n.cats.map(c=>({id:c.id||uid(),name:String(c.name||"Sin nombre"),i:c.i,bg:hx(c.bg),img:im(c.img),fit:fv(c.fit),p:(c.p&&c.p!==c.id&&ids.has(c.p))?c.p:undefined,
      links:(c.links||[]).filter(l=>norm(l.url)).map(l=>({id:l.id||uid(),title:String(l.title||host(l.url)),url:norm(l.url),i:l.i,c:l.c,bg:hx(l.bg),img:im(l.img),fit:fv(l.fit),n:l.n>0?Math.floor(l.n):undefined}))}));
    cats.forEach(c=>{if(c.p){const p=cats.find(x=>x.id===c.p);if(!p||p.p)c.p=undefined}});
    if(!cats.some(c=>!c.p))return null;
    return{cats,fit:fv(n.fit)}}catch(e){return null}}
function importData(txt){
  const n=parseData(txt);if(!n)return false;
  S={m3:1,fit:n.fit,cats:n.cats};cur=n.cats.find(c=>!c.p).id;SEL=null;save();render();return true}
function mergeData(txt){
  const n=parseData(txt);if(!n)return null;
  const byId=new Map(n.cats.map(c=>[c.id,c])),map=new Map();let nc=0,nl=0;
  const find=(name,pid)=>S.cats.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(x.p||"")===(pid||""));
  const ensure=ic=>{if(map.has(ic.id))return map.get(ic.id);
    const pid=ic.p?ensure(byId.get(ic.p)).id:undefined;
    let c=find(ic.name,pid);
    if(!c){c={id:uid(),name:ic.name,i:ic.i,bg:ic.bg,img:ic.img,fit:ic.fit,p:pid,links:[]};S.cats.push(c);nc++}
    map.set(ic.id,c);return c};
  n.cats.forEach(ic=>{const c=ensure(ic);ic.links.forEach(l=>{if(!c.links.some(z=>z.url===l.url)){c.links.push({...l,id:uid()});nl++}})});
  save();render();return{nc,nl}}
function loadCopy(txt,replace){
  if(replace){if(importData(txt)){close();toast("Copia cargada: se ha sustituido todo.");return true}}
  else{const r=mergeData(txt);if(r){close();toast(r.nl||r.nc?"Añadidos "+r.nl+(r.nl===1?" enlace":" enlaces")+" y "+r.nc+(r.nc===1?" categoría nueva.":" categorías nuevas."):"No había nada nuevo que añadir.");return true}}
  toast("Ese texto o archivo no es una copia válida.");return false}
