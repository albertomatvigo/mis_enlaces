<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e2e0d8;--ac:#2f6f5e;--ac2:#e0eee9;--dg:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--sf:#222427;--tx:#e8e8e6;--mu:#9aa0a6;--bd:#34373b;--ac:#5fb59d;--ac2:#243a34;--dg:#e07368;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--sf:#222427;--tx:#e8e8e6;--mu:#9aa0a6;--bd:#34373b;--ac:#5fb59d;--ac2:#243a34;--dg:#e07368;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input:focus{outline:2px solid var(--ac);outline-offset:0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.dg{color:var(--dg)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 6px}
.tab{display:inline-flex;align-items:center;gap:10px;border-radius:16px;padding:12px 18px;font-size:16px;font-weight:600;color:var(--tx);background:color-mix(in srgb,var(--k,var(--ac)) 20%,var(--sf));border:2px solid color-mix(in srgb,var(--k,var(--ac)) 45%,var(--sf))}.tab .ci{font-size:28px;line-height:1}
.tabs.sortable .tab:not(.add){cursor:grab}
.tab{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tab.drag{z-index:50;cursor:grabbing;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:none}
.tab.on{background:var(--k);border-color:var(--k);color:#fff}
.tab.add{background:none;border:2px dashed var(--bd);color:var(--mu);font-weight:500}
@media (max-width:640px){.tab{padding:10px 13px;font-size:15px}.tab .ci{font-size:24px}}
.tab small{font-weight:500;opacity:.7;font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.bar h2{font-size:16px;margin:0}
.add{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px}
.add input{flex:1 1 180px}
.acts{display:flex;gap:6px}.acts button{padding:4px 9px;font-size:13px}
.bar .acts{gap:2px}
.bar .acts button{border:none;background:none;color:var(--mu);padding:4px 8px;font-size:13px;border-radius:6px}
.bar .acts button:hover{color:var(--ac);background:var(--ac2)}
.bar .acts button.dg:hover{color:var(--dg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.tile{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:16px;transition:transform .12s,border-color .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.tile>a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 10px 14px;min-height:150px;color:var(--tx);text-decoration:none;text-align:center}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.grid.sortable .tile{cursor:grab}
.tile.drag{z-index:50;cursor:grabbing;border-color:var(--ac);box-shadow:0 12px 30px rgba(0,0,0,.28);transition:none}
.sorting,.sorting *{cursor:grabbing!important}
.ico{width:72px;height:72px;border-radius:20px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:34px;line-height:1}
.ico.em{font-size:42px}
.tile b{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tile small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu);font-size:11px}
.ed{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;display:grid;place-items:center;border:none;background:none;color:var(--mu);border-radius:50%;font-size:15px;opacity:.55}
.tile:hover .ed,.ed:focus-visible{opacity:1;background:var(--ac2);color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.tag{font-size:12px;color:var(--mu);margin:6px 0 2px}
@media (hover:none){.ed{opacity:.85;width:34px;height:34px}}
@media (max-width:640px){main{padding:12px}input{font-size:16px}.grid{grid-template-columns:repeat(3,1fr);gap:10px}.tile>a{min-height:120px;padding:20px 6px 10px}.ico{width:56px;height:56px;font-size:27px}.ico.em{font-size:33px}}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);width:min(440px,92vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px;font-size:16px}
dialog input,dialog textarea{width:100%;margin-bottom:8px}
textarea{font:12px/1.4 ui-monospace,monospace;height:150px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.end{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

      S={m3:1,cats:n.cats.map(c=>({id:c.id,name:String(c.name||"Sin nombre"),i:c.i,k:c.k,links:c.links}))};cur=S.cats[0].id;save();close();render()}catch(e){ta.style.borderColor="var(--dg)"}}}),
    el("button",{textContent:"Cerrar",onclick:close})))});

enableSort($("#tabs"),{sel:".tab:not(.add)",done:order=>{S.cats.forEach(x=>{if(!x.k)x.k=cc(x)});S.cats.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id))}});
